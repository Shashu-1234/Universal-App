name: Mobile Build
on:
  pull_request:
jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
