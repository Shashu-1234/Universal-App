version: '3.9'
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: remote
      POSTGRES_PASSWORD: remote
      POSTGRES_DB: universal_remote
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'
